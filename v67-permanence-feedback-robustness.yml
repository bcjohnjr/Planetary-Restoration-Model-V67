name: V67 Permanence and Feedback Robustness

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  V65_COMMIT: "ea15518d4434b25f92328f7cf943a958778e8495"
  V622_COMMIT: "89a0f4ab18df25db3a05d4e39c6db06405456505"
  FAIR_COMMIT: "ec46fefc8f8c6b560a8b78ab1f4a9a5e04537f79"
  OSCAR_COMMIT: "3ce008400e06363564e5981a35cbc32377d41d86"
  FAIR_SOURCE_DIR: /tmp/FAIR-v2.2.4

jobs:
  robustness-matrix:
    name: ${{ matrix.case_id }} — FaIR + Hector + OSCAR
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {case_id: "fixed__early", off_zero: "0"}
          - {case_id: "fixed__late", off_zero: "0"}
          - {case_id: "permanent__early", off_zero: "1"}
          - {case_id: "permanent__late", off_zero: "1"}
          - {case_id: "coupled__early", off_zero: "1"}
          - {case_id: "coupled__canonical", off_zero: "1"}
          - {case_id: "coupled__uniform", off_zero: "1"}
          - {case_id: "coupled__late", off_zero: "1"}
          - {case_id: "coupled_pfzero__early", off_zero: "1"}
          - {case_id: "coupled_pfzero__late", off_zero: "1"}
          - {case_id: "coupled_pfdouble__early", off_zero: "1"}
          - {case_id: "coupled_pfdouble__late", off_zero: "1"}
    env:
      V67_OFF_STORED_REVERSAL_ZERO: ${{ matrix.off_zero }}
    steps:
      - name: Checkout V67 experiment package
        uses: actions/checkout@v7

      - name: Set up Python 3.12 for trajectory generation and FaIR
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install trajectory and FaIR dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install fair==2.2.4 numpy pandas xarray scipy
          python - <<'PY'
          import fair
          import numpy
          import pandas
          assert fair.__version__ == "2.2.4"
          print("FaIR", fair.__version__)
          print("NumPy", numpy.__version__)
          print("pandas", pandas.__version__)
          PY

      - name: Preflight V67 package files
        run: |
          set -euo pipefail
          for f in             generate_robustness_matrix_v67.py             patch_fair_v67.py             patch_hector_v67.py             patch_oscar_v67.py             analyze_v67_case.py             synthesize_v67.py
          do
            test -f "$f" || { echo "ERROR: missing root file $f"; exit 1; }
          done
          python -m py_compile             generate_robustness_matrix_v67.py             patch_fair_v67.py             patch_hector_v67.py             patch_oscar_v67.py             analyze_v67_case.py             synthesize_v67.py

      - name: Restore pinned V65 and V62.2 code
        run: |
          set -euo pipefail
          rm -rf /tmp/V65 /tmp/V62.2
          git clone https://github.com/bcjohnjr/Planetary-Restoration-Model-V65.git /tmp/V65
          git -C /tmp/V65 checkout --detach "$V65_COMMIT"
          git clone https://github.com/bcjohnjr/Planetary-Restoration-Version-62.2.git /tmp/V62.2
          git -C /tmp/V62.2 checkout --detach "$V622_COMMIT"
          test "$(git -C /tmp/V65 rev-parse HEAD)" = "$V65_COMMIT"
          test "$(git -C /tmp/V62.2 rev-parse HEAD)" = "$V622_COMMIT"
          cp /tmp/V62.2/external_validation_net_co2_trajectory.csv .
          cp /tmp/V62.2/run_fair_matched_forcing_v62.py .
          cp /tmp/V62.2/run_hector_matched_forcing_v62.R .
          cp /tmp/V62.2/run_oscar_validation_v62.py .
          cp /tmp/V65/patch_hector_v65.py .
          cp /tmp/V65/run_oscar_matched_forcing_v63.py .
          echo "f2d58812b8c54bfc52da1dee360ca06f8ccfb888791cf3dc1105bc038ae3a637  external_validation_net_co2_trajectory.csv" | sha256sum -c -

      - name: Generate and verify V67 trajectories
        run: |
          set -euo pipefail
          rm -rf trajectories
          python generate_robustness_matrix_v67.py             --input external_validation_net_co2_trajectory.csv             --outdir trajectories
          test -f "trajectories/${{ matrix.case_id }}.csv"
          test -f trajectories/manifest.csv
          test -f trajectories/manifest.json
          python - <<'PY'
          import pandas as pd
          m = pd.read_csv("trajectories/manifest.csv")
          assert len(m) == 12
          assert m["case_id"].nunique() == 12
          assert "${{ matrix.case_id }}" in set(m["case_id"])
          print(m[["case_id","reversal_protocol","schedule","permafrost_protocol"]].to_string(index=False))
          PY
      - name: Clone pinned FaIR source
        run: |
          rm -rf "$FAIR_SOURCE_DIR"
          git clone --depth 1 --branch v2.2.4 https://github.com/OMS-NetZero/FAIR.git "$FAIR_SOURCE_DIR"
          test "$(git -C "$FAIR_SOURCE_DIR" rev-parse HEAD)" = "$FAIR_COMMIT"
      - name: Stage and run FaIR
        run: |
          set -euo pipefail
          rm -rf fair_work; mkdir fair_work
          cp "trajectories/${{ matrix.case_id }}.csv" fair_work/external_validation_net_co2_trajectory.csv
          cp run_fair_matched_forcing_v62.py fair_work/run_fair_base.py
          sed -i 's/^END_YEAR = 2300$/END_YEAR = 2183/' fair_work/run_fair_base.py
          python patch_fair_v67.py fair_work/run_fair_base.py fair_work/run_fair_v67.py
          cd fair_work
          python run_fair_v67.py 2>&1 | tee FAIR_V67_CONSOLE.log
      - name: Verify FaIR
        run: |
          cd fair_work
          python - <<'PY'
          import json,numpy as np,pandas as pd
          s=json.load(open('fair_matched_summary.json')); ts=pd.read_csv('fair_matched_timeseries.csv'); mem=pd.read_csv('fair_member_metrics.csv')
          assert s['version']=='2.2.4' and s['configs']==841 and len(mem)==841 and len(ts)==158
          assert float(s['common_state_2026_co2_maxabs_ppm'])<=1e-6 and float(s['common_state_2026_tas_maxabs_c'])<=1e-6
          assert np.isfinite(mem.drop(columns=['member_id']).to_numpy(float)).all()
          tol=float(s['forcing_match_tolerance_wm2']); assert float(s['forcing_match_max_abs_on_wm2'])<=tol and float(s['forcing_match_max_abs_off_wm2'])<=tol
          PY
      - uses: r-lib/actions/setup-r@v2
        with: {r-version: "4.5.1", use-public-rspm: true}
      - name: Install Hector
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-dev libboost-filesystem-dev libboost-system-dev
          Rscript -e 'install.packages(c("Rcpp","BH","jsonlite"), repos="https://cloud.r-project.org")'
          rm -rf /tmp/hector-v3.5.0
          git clone --depth 1 --branch v3.5.0 https://github.com/JGCRI/hector.git /tmp/hector-v3.5.0
          R CMD INSTALL --no-multiarch --with-keep.source /tmp/hector-v3.5.0
      - name: Stage and run Hector
        run: |
          set -euo pipefail
          rm -rf hector_work; mkdir hector_work
          cp "trajectories/${{ matrix.case_id }}.csv" hector_work/external_validation_net_co2_trajectory.csv
          cp fair_work/fair_matched_nonco2_forcing.csv hector_work/
          python patch_hector_v65.py run_hector_matched_forcing_v62.R hector_work/run_hector_2183.R
          python patch_hector_v67.py hector_work/run_hector_2183.R hector_work/run_hector_v67.R
          Rscript -e 'parse(file="hector_work/run_hector_v67.R")'
          cd hector_work
          Rscript run_hector_v67.R 2>&1 | tee HECTOR_V67_CONSOLE.log
      - name: Verify Hector
        run: |
          cd hector_work
          Rscript - <<'RS'
          library(jsonlite); s<-read_json('hector_matched_summary.json', simplifyVector=TRUE); ts<-read.csv('hector_matched_timeseries.csv')
          stopifnot(nrow(ts)==158, ts$year[1]==2026, ts$year[nrow(ts)]==2183)
          stopifnot(as.numeric(s$common_state_2026_co2_abs_error_ppm)<=1e-8, as.numeric(s$common_state_2026_tas_abs_error_c)<=1e-8)
          tol<-as.numeric(s$forcing_match_tolerance_wm2); stopifnot(as.numeric(s$forcing_match_max_abs_on_wm2)<=tol, as.numeric(s$forcing_match_max_abs_off_wm2)<=tol)
          RS
      - uses: actions/setup-python@v7
        with: {python-version: "3.9"}
      - name: Install OSCAR runtime
        run: |
          python -m pip install --upgrade 'pip<25'
          pip install 'numpy==1.23.3' 'scipy==1.9.3' 'pandas==1.5.3' 'xarray==0.20.1' 'matplotlib==3.7.5' 'netCDF4==1.6.5' 'h5netcdf==1.3.0' 'h5py==3.10.0'
      - name: Clone OSCAR and run V67
        run: |
          set -euo pipefail
          rm -rf _oscar oscar_results
          git clone https://github.com/tgasser/OSCAR.git _oscar
          git -C _oscar checkout --detach "$OSCAR_COMMIT"
          test "$(git -C _oscar rev-parse HEAD)" = "$OSCAR_COMMIT"
          python patch_oscar_v67.py run_oscar_matched_forcing_v63.py run_oscar_matched_forcing_v67.py
          python run_oscar_matched_forcing_v67.py --oscar-root "$GITHUB_WORKSPACE/_oscar" --trajectory "$GITHUB_WORKSPACE/trajectories/${{ matrix.case_id }}.csv" --forcing-target "$GITHUB_WORKSPACE/fair_work/fair_matched_nonco2_forcing.csv" --outdir "$GITHUB_WORKSPACE/oscar_results" --nmc 200 --end-year 2183 --forcing-tol 1e-4 --max-iters 6 2>&1 | tee OSCAR_V67_CONSOLE.log
      - name: Verify OSCAR
        run: |
          python - <<'PY'
          import json,numpy as np,pandas as pd
          s=json.load(open('oscar_results/oscar_matched_summary.json')); mem=pd.read_csv('oscar_results/oscar_member_metrics.csv')
          assert s['status']=='PASS' and s['ensemble_members']==200 and len(mem)==200 and all(bool(v) for v in s['gates'].values())
          assert np.isfinite(mem.drop(columns=['member_id']).to_numpy(float)).all()
          PY
      - name: Analyze case
        run: |
          rm -rf case_results; mkdir case_results
          python analyze_v67_case.py --case-id "${{ matrix.case_id }}" --manifest trajectories/manifest.csv --trajectory "trajectories/${{ matrix.case_id }}.csv" --fair-timeseries fair_work/fair_matched_timeseries.csv --hector-timeseries hector_work/hector_matched_timeseries.csv --oscar-timeseries oscar_results/oscar_matched_timeseries.csv --output case_results/v67_case_summary.json | tee V67_CASE_ANALYSIS.log
      - name: Upload case artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v67-case-${{ matrix.case_id }}
          retention-days: 90
          if-no-files-found: warn
          path: |
            trajectories/${{ matrix.case_id }}.csv
            trajectories/manifest.csv
            trajectories/manifest.json
            fair_work/fair_matched_timeseries.csv
            fair_work/fair_matched_summary.json
            fair_work/fair_member_metrics.csv
            fair_work/FAIR_V67_CONSOLE.log
            hector_work/hector_matched_timeseries.csv
            hector_work/hector_matched_summary.json
            hector_work/HECTOR_V67_CONSOLE.log
            oscar_results/oscar_matched_timeseries.csv
            oscar_results/oscar_matched_summary.json
            oscar_results/oscar_reservoir_decomposition.csv
            oscar_results/oscar_member_metrics.csv
            OSCAR_V67_CONSOLE.log
            case_results/v67_case_summary.json
            V67_CASE_ANALYSIS.log

  synthesize:
    needs: robustness-matrix
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: {pattern: "v67-case-*", path: experiment_artifacts, merge-multiple: false}
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: python -m pip install numpy pandas
      - run: python synthesize_v67.py --root experiment_artifacts --outdir v67_results | tee V67_SYNTHESIS_CONSOLE.log
      - run: cat v67_results/V67_ROBUSTNESS_RESULTS.md
      - uses: actions/upload-artifact@v7
        with:
          name: V67-Permanence-Feedback-Robustness-Synthesis
          retention-days: 90
          if-no-files-found: error
          path: |
            v67_results/
            V67_SYNTHESIS_CONSOLE.log
